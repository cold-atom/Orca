name: Blender asset workspaces

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  native-workspace:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ORCA_DISABLE_ACCOUNT_RESTORE: "1"
      ORCA_DISABLE_UPDATE_CHECKS: "1"
      ORCA_DISABLE_NATIVE_HELPER_DOWNLOADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact official Blender and verify SHA-256
        run: python scripts/install_ci_blender.py
      - name: Verify actual modeling, rigging, animation, rendering, export and recovery
        run: python -m unittest discover -s tests -p blender_workspace_test.py -v
      - name: Install pinned Godot
        if: runner.os == 'Linux'
        run: python scripts/install_ci_godot.py
      - name: Verify owned interactive live-authoring and native Undo
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libxi6 libxrender1 libxkbcommon0
          xvfb-run -a python -m unittest discover -s tests -p blender_live_test.py -v
      - name: Verify editor approvals, import, placement, Undo and cancellation
        if: runner.os == 'Linux'
        run: python tests/run_editor_test.py blender_workspace_editor_test.gd --blender-workspace-executable "$ORCA_TEST_BLENDER_BIN"
